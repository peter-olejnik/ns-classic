# NS server stack. Build the image first with hosting/build.sh, then:
#
#   cd hosting && podman compose up -d      (or docker compose)
#   podman compose --profile hltv up -d     also start the HLTV proxy
#
# Settings: .env.default, overridden by an optional .env (see .env.default).

name: ns-classic

x-server: &server
  image: localhost/ns-classic-server:latest
  pull_policy: never
  restart: unless-stopped
  env_file:
    - path: .env.default
    - path: .env
      required: false

services:
  hlds:
    <<: *server
    command: hlds
    # Keep a console to attach to
    tty: true
    stdin_open: true
    ports:
      - "${HLDS_PORT:-27016}:${HLDS_PORT:-27016}/udp"
      - "26900:26900/udp"
    volumes:
      - logs:/home/steam/hlds/ns/logs
      # Core dumps, if the host's core_pattern points here (see README)
      - cores:/home/steam/hlds/cores

  # Optional: started only with --profile hltv. It can't connect to a server
  # whose mapcycle file is over about 8 KB (see mapmerge/merge-report.md).
  hltv:
    <<: *server
    profiles: [hltv]
    command: hltv
    tty: true
    stdin_open: true
    depends_on:
      - hlds
    ports:
      - "${HLTV_PORT:-27020}:${HLTV_PORT:-27020}/udp"
    volumes:
      - demos:/home/steam/hlds/ns/demos
      - cores:/home/steam/hlds/cores

  rotate:
    <<: *server
    command: rotate
    volumes:
      - logs:/home/steam/hlds/ns/logs
      - demos:/home/steam/hlds/ns/demos

volumes:
  logs:
  demos:
  cores:
